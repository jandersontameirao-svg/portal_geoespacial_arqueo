# Reverse proxy do Portal Geoespacial Arqueo.
#
# Instalação na VPS:
#   1) Salve como /etc/nginx/sites-available/geoportal
#   2) ln -s /etc/nginx/sites-available/geoportal /etc/nginx/sites-enabled/geoportal
#   3) nginx -t && systemctl reload nginx
#   4) certbot --nginx -d geoportal.sigpa.com.br --redirect
#      (o certbot reescreve este bloco adicionando o listen 443 + TLS)

server {
    listen 80;
    listen [::]:80;
    server_name geoportal.sigpa.com.br;

    # Uploads geoespaciais podem ser grandes; o app aceita body de 50 MB.
    client_max_body_size 60M;

    # Timeouts folgados para processamento de arquivos/mapas.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # WebSocket/keep-alive (inofensivo se não houver ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Essencial: o app usa isto para marcar o cookie de sessão como `secure`.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
